server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
